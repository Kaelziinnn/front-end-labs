<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Fale Conosco</title>
  <link rel="stylesheet" href="fale-conosco.css">
</head>

<body>
  <main class="container">
    <header>
      <h1>Fale Conosco</h1>
      <p>
        Estamos aqui para ajudar! Preencha o formulário abaixo e entraremos em
        contato com você o mais breve possível.
      </p>
    </header>

    <form action="./send-message.html" method="get">
      <div class="form-group">
        <label for="name">Primeiro Nome</label>
        <input type="text" id="name" placeholder="Seu nome..." required>
      </div>

      <div class="form-group">
        <label for="last_name">Último Nome</label>
        <input type="text" id="last_name" placeholder="Seu sobrenome..." required>
      </div>

      <div class="form-group">
        <label for="email">E-mail</label>
        <input type="email" id="email" placeholder="Seu email..." required>
      </div>

      <div class="form-group">
        <label for="pais">País</label>
        <select id="pais" required>
          <option disabled selected>Selecione seu país...</option>
          <option>Brasil</option>
          <option>Portugal</option>
          <option>Angola</option>
          <option>Moçambique</option>
        </select>
      </div>

      <div class="form-group">
        <label for="message">Assunto</label>
        <textarea id="message" placeholder="Escreva aqui..." required></textarea>
      </div>

      <div class="btn-container">
        <input type="reset" value="Limpar">
        <input type="submit" value="Enviar">
      </div>
    </form>

    <footer class="footer-contact">
      <p>Em caso de dúvidas entre em contato.   </p>
    </footer>
  </main>
</body>
</html>
