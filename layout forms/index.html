<!DOCTYPE html>
<html lang="pt-br">
<head>
  <meta charset="UTF-8">
  <title>Cadastro</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>

<div class="container">

  <div class="header">
    <div>
      <h2>Faça seu cadastro!</h2>
      <small>Compre online 🔖</small>
    </div>
    <div class="icons">
      🙍‍♂️👩
    </div>
  </div>

  <form>

    <div class="section-title">Dados Pessoais</div>
    <div class="grid">
      <div class="form-group full">
        <label>Nome</label>
        <input type="text">
      </div>

      <div class="form-group full">
        <label>E-mail</label>
        <input type="email">
      </div>

      <div class="form-group">
        <label>Data de Nascimento</label>
        <input type="date">
      </div>

      <div class="form-group">
        <label>CPF</label>
        <input type="text" placeholder="000.000.000-00">
      </div>
    </div>

    <div class="section-title">Endereço</div>
    <div class="grid">
      <div class="form-group full">
        <label>Rua</label>
        <input type="text">
      </div>

      <div class="form-group">
        <label>Número</label>
        <input type="number">
      </div>

      <div class="form-group">
        <label>Bairro</label>
        <input type="text">
      </div>

      <div class="form-group">
        <label>CEP</label>
        <input type="text" placeholder="00000-000">
      </div>

      <div class="form-group">
        <label>Cidade</label>
        <input type="text">
      </div>

      <div class="form-group">
        <label>Estado</label>
        <select>
          <option>Selecione um estado</option>
          <option>SP</option>
          <option>RJ</option>
          <option>MG</option>
        </select>
      </div>
    </div>

    <div class="section-title">Login</div>
    <div class="grid">
      <div class="form-group full">
        <label>Imagem de perfil</label>
        <input type="file">
      </div>

      <div class="form-group">
        <label>Login</label>
        <input type="text">
      </div>

      <div class="form-group">
        <label>Senha</label>
        <input type="password">
      </div>

      <div class="form-group full">
        <label>Confirmação de Senha</label>
        <input type="password">
      </div>
    </div>

    <div class="buttons">
      <button type="reset" class="btn cancel">Cancelar</button>
      <button type="submit" class="btn submit">Enviar</button>
    </div>

  </form>

</div>

</body>
</html>
